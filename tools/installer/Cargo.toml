[package]
name = "flow-installer"
version = "0.4.14"
edition = "2024"
[features]
default = ["standalone-installer"]
standalone-installer = []
[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
anyhow = "1"
dunce = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.17.2", default-features = false }
[build-dependencies]
winresource = "0.1.31"
[dev-dependencies]
tempfile = "3"
