[package]
name = "flow-download"
version = "0.4.10"
edition = "2024"

[features]
standalone-installer = []

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-sha1-wrapper = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
dunce = "1"
fs2 = "0.4"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde_bencode = "0.2"
rfd = { version = "0.17.2", default-features = false }
tray-icon = { version = "0.25.1", default-features = false }
raw-window-handle = "0.6"
arboard = { version = "3.6.1", default-features = false }
sha2 = "0.10"
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
librqbit = { path = "vendor/librqbit" }

[build-dependencies]
winresource = "0.1.31"
