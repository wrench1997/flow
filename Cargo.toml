[package]
name = "flow-download"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = "0.8"
anyhow = "1"
fs2 = "0.4"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde_bencode = "0.2"
rfd = { version = "0.17.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.31"
